<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" width="940" height="650" role="img" aria-labelledby="t d">
  <title id="t">Архитектура: один исходящий IP на всю машину</title>
  <desc id="d">Windows-сервер с двумя RDP-сессиями. Один инстанс Proxifier перехватывает трафик обеих сессий и системных служб и отправляет его через резидентский статический прокси в интернет. RDP-подключение идёт напрямую по localhost-правилу.</desc>

  <style>
    :root {
      --bg: #ffffff;
      --ink: #15181d;
      --muted: #666d78;
      --line: #cfd4dc;
      --box: #f7f8fa;
      --accent: #1f5fd0;
      --accent-soft: #eaf1fd;
      --warn: #96560a;
      --warn-soft: #fdf6e7;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #13151a;
        --ink: #e9ebef;
        --muted: #99a0ab;
        --line: #393f4a;
        --box: #1b1e25;
        --accent: #7aacff;
        --accent-soft: #19253a;
        --warn: #f0b429;
        --warn-soft: #2a2415;
      }
    }
    :root[data-theme="dark"] {
      --bg: #13151a;
      --ink: #e9ebef;
      --muted: #99a0ab;
      --line: #393f4a;
      --box: #1b1e25;
      --accent: #7aacff;
      --accent-soft: #19253a;
      --warn: #f0b429;
      --warn-soft: #2a2415;
    }
    .canvas { fill: var(--bg); }
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      fill: var(--ink);
    }
    .h1 { font-size: 19px; font-weight: 700; }
    .sub { font-size: 13px; fill: var(--muted); }
    .boxlabel { font-size: 13px; font-weight: 700; }
    .item { font-size: 12.5px; }
    .dim { font-size: 12px; fill: var(--muted); }
    .tag { font-size: 11.5px; fill: var(--muted); }
    .acc { fill: var(--accent); }
    .wrn { fill: var(--warn); }
    .card { fill: var(--box); stroke: var(--line); stroke-width: 1.5; }
    .shell { fill: none; stroke: var(--line); stroke-width: 1.5; }
    .hot { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
    .caution { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .flow { fill: none; stroke: var(--accent); stroke-width: 2; marker-end: url(#ah); }
    .flow-dim { fill: none; stroke: var(--muted); stroke-width: 1.75; stroke-dasharray: 6 4; marker-end: url(#ahm); }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
    <marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="940" height="650"/>

  <text class="h1" x="30" y="34">Один исходящий IP на всю машину</text>
  <text class="sub" x="30" y="57">Один инстанс Proxifier перехватывает трафик обеих RDP-сессий и системных служб</text>

  <!-- server shell -->
  <rect class="shell" x="30" y="80" width="540" height="400" rx="14"/>
  <text class="boxlabel" x="50" y="108">Windows Server 2022 · VPS</text>

  <!-- session A -->
  <rect class="card" x="52" y="122" width="250" height="154" rx="10"/>
  <text class="boxlabel" x="68" y="148">RDP-сессия 1</text>
  <text class="dim" x="68" y="166">Administrator</text>
  <text class="item" x="68" y="196">Chrome</text>
  <text class="item" x="68" y="220">Claude Code Desktop</text>
  <text class="item" x="68" y="244">git · gh · mise</text>

  <!-- session B -->
  <rect class="card" x="318" y="122" width="236" height="154" rx="10"/>
  <text class="boxlabel" x="334" y="148">RDP-сессия 2</text>
  <text class="dim" x="334" y="166">рабочий юзер</text>
  <text class="item" x="334" y="196">Chrome</text>
  <text class="item" x="334" y="220">Claude Code Desktop</text>
  <text class="item" x="334" y="244">свои проекты и ключи</text>

  <path class="flow" d="M177,276 L177,310"/>
  <path class="flow" d="M436,276 L436,310"/>

  <!-- proxifier -->
  <rect class="hot" x="52" y="312" width="502" height="86" rx="10"/>
  <text class="boxlabel acc" x="68" y="338">Proxifier</text>
  <text class="item" x="68" y="360">ProcessOtherUsers = true · ProcessServices = true</text>
  <text class="item" x="68" y="382">DNS and IP Leak Prevention Mode = on</text>

  <!-- kill switch -->
  <rect class="caution" x="52" y="410" width="502" height="54" rx="10"/>
  <text class="tag wrn" x="68" y="432" font-weight="700">Kill switch</text>
  <text class="tag" x="68" y="452">прокси недоступен → трафик блокируется, а не идёт напрямую</text>

  <!-- proxifier -> proxy (elbow) -->
  <path class="flow" d="M554,355 L600,355 L600,196 L624,196"/>
  <text class="tag" x="606" y="282">весь</text>
  <text class="tag" x="606" y="298">трафик</text>

  <!-- proxy -->
  <rect class="card" x="632" y="140" width="278" height="112" rx="12"/>
  <text class="boxlabel" x="650" y="170">Резидентский статический прокси</text>
  <text class="dim" x="650" y="194">1 выделенный IP · HTTPS</text>
  <text class="dim" x="650" y="216">не меняется и ни с кем не шарится</text>
  <text class="dim" x="650" y="238">DNS резолвится здесь же</text>

  <path class="flow" d="M771,252 L771,314"/>

  <!-- internet -->
  <rect class="card" x="632" y="322" width="278" height="142" rx="12"/>
  <text class="boxlabel" x="650" y="352">Интернет</text>
  <text class="item" x="650" y="380">claude.ai</text>
  <text class="item" x="650" y="404">GitHub · OpenRouter</text>
  <text class="item" x="650" y="428">Cloudinary · всё остальное</text>
  <text class="tag" x="650" y="450">видят один и тот же IP</text>

  <!-- you / rdp -->
  <rect class="card" x="30" y="540" width="222" height="78" rx="10"/>
  <text class="boxlabel" x="48" y="570">Ты · RDP-клиент</text>
  <text class="dim" x="48" y="594">подключение к серверу</text>

  <path class="flow-dim" d="M141,540 L141,484"/>

  <text class="tag wrn" x="280" y="566" font-weight="700">localhost-правило не проксируется</text>
  <text class="tag" x="280" y="586">иначе RDP отвалится вместе с настройкой —</text>
  <text class="tag" x="280" y="604">и зайти на сервер будет уже нечем</text>
</svg>
